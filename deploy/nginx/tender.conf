# Tender Intelligence Platform - Nginx 生产模板
# 复制到 /etc/nginx/conf.d/tender.conf，替换域名/证书/静态目录后 nginx -t 重载。

upstream tender_backend {
    server 127.0.0.1:48080;
    keepalive 32;
}

# HTTP -> HTTPS
server {
    listen 80;
    server_name tender.example.com admin.tender.example.com;
    return 301 https://$host$request_uri;
}

# 用户端 + H5
server {
    listen 443 ssl http2;
    server_name tender.example.com;

    ssl_certificate     /etc/letsencrypt/live/tender.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tender.example.com/privkey.pem;

    root /var/www/tender/user-web;
    index index.html;
    client_max_body_size 32m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
    gzip_min_length 1024;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # H5（UniApp 构建产物）
    location /h5/ {
        alias /var/www/tender/h5/;
        try_files $uri $uri/ /h5/index.html;
    }

    # 门户 / 会员接口
    location /admin-api/ {
        proxy_pass http://tender_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /app-api/ {
        proxy_pass http://tender_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # WebSocket
    location /infra/ws {
        proxy_pass http://tender_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }
}

# 管理端
server {
    listen 443 ssl http2;
    server_name admin.tender.example.com;

    ssl_certificate     /etc/letsencrypt/live/admin.tender.example.com/fullchain.pem;
